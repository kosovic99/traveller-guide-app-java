spring.application.name=traveller-guide-api
server.port=8081

spring.datasource.url=jdbc:mariadb://localhost:3307/2135037db3
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=false

traveller-guide.security.api-key.value=${TRAVELLER_GUIDE_API_KEY:local-dev-api-key}
traveller-guide.security.api-key.header-name=X-API-Key
traveller-guide.security.api-key.enforce-https=false
