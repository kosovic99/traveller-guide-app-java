server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:travellerguide;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

traveller-guide:
  security:
    api-key:
      value: local-dev-api-key
      enforce-https: false
