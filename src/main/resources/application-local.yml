spring:
  datasource:
    url: jdbc:mysql://localhost:3306/traveller_guide?useSSL=false&serverTimezone=Europe/Vienna&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

traveller-guide:
  security:
    api-key:
      value: ${TRAVELLER_GUIDE_API_KEY:local-dev-api-key}
      enforce-https: false
